<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="selectScreen">
        <div class="catSelect">
            <h1>CATS</h1>
            <button class="catDiv charSelect">
                <img src="images/siamese.jpg" height="150px" class="selectImage" imgIndex="0">
                <div class="selectName">Siamese</div>
            </button>
            <button class="catDiv charSelect">
                <img src="images/tabby.jpg" height="150px" class="selectImage" imgIndex="1">
                <div class="selectName">Tabby</div>
            </button>
            <button class="catDiv charSelect">
                <img src="images/bombay.jpg" height="150px" class="selectImage" imgIndex="2">
                <div class="selectName">Bombay</div>
            </button>
            <button class="catDiv charSelect">
                <img src="images/maineCoon.jpg" height="150px" class="selectImage" imgIndex="3">
                <div class="selectName">Maine Coon</div>
            </button>
        </div>
        <button class="ready">Ready</button>
        <div class="dogSelect">
            <h1>DOGS</h1>
            <button class="dogDiv charSelect">
                <img src="images/goldenRetriever.jpg" height="150px" class="selectImage" imgIndex="4">
                <div class="selectName">Golden Retriever</div>
            </button>
            <button class="dogDiv charSelect">
                <img src="images/husky.jpg" height="150px" class="selectImage" imgIndex="5">
                <div class="selectName">Husky</div>
            </button>
            <button class="dogDiv charSelect">
                <img src="images/pug.jpg" height="150px" class="selectImage" imgIndex="6">
                <div class="selectName">Pug</div>
            </button>
            <button class="dogDiv charSelect">
                <img src="images/saintBernard.jpg" height="150px" class="selectImage" imgIndex="7">
                <div class="selectName">Saint Bernard</div>
            </button>
        </div>
    </div>
    <div class="gameScreen hidden">
        <div class="leftArea">
            <div class="leftAreaContent">
                <img src="images/placeholder.webp" height="150px" class="playerImage">
                <div class="leftPlayerText">
                    <div class="playerName">Player Name</div>
                    <div class="playerWins">Wins: 0</div>
                </div>
            </div>
        </div>
        <div class="gameArea">
            <div class="gameTopButtons">
                <button>
                    <img src="images/refresh.svg" height="50px" alt="refresh icon" class="refresh">
                </button>
                <button>
                    <img src="images/exit.svg" height="50px" alt="exit icon" class="exit">
                </button>
            </div>
            <div class="gameGrid">
                <button class="gridBlock" row="1" col="1"></button>
                <button class="gridBlock" row="1" col="2"></button>
                <button class="gridBlock" row="1" col="3"></button>
                <button class="gridBlock" row="2" col="1"></button>
                <button class="gridBlock" row="2" col="2"></button>
                <button class="gridBlock" row="2" col="3"></button>
                <button class="gridBlock" row="3" col="1"></button>
                <button class="gridBlock" row="3" col="2"></button>
                <button class="gridBlock" row="3" col="3"></button>
            </div>
            <div class="ties">Ties: 0</div>
        </div>
        <div class="rightArea">
            <div class="rightAreaContent">
                <img src="images/placeholder.webp" height="150px" class="playerImage">
                <div class="rightPlayerText">
                    <div class="playerName">Player Name</div>
                    <div class="playerWins">Wins: 0</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
